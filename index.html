<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Level Monitor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f6fa;
      min-height: 100vh;
      padding: 25px 15px;
    }

    .container {
      max-width: 450px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #123b5d;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .label {
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .value {
      font-size: 64px;
      font-weight: bold;
      color: #1677b7;
    }

    .unit {
      font-size: 25px;
      color: #555;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: bold;
    }

    .updated {
      margin-top: 18px;
      color: #777;
      font-size: 14px;
    }

    button {
      margin-top: 22px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #1677b7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #125f91;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💧 Water Level Monitor</h1>

    <div class="card">

      <div class="label">Current Water Level</div>

      <div>
        <span class="value" id="waterLevel">--</span>
        <span class="unit">%</span>
      </div>

      <div class="status" id="status">
        Loading...
      </div>

      <div class="updated" id="updated">
        Waiting for data...
      </div>

      <button onclick="getWaterLevel()">
        Refresh
      </button>

    </div>

  </div>

  <script>

    async function getWaterLevel() {

      try {

        const response = await fetch(
          "https://api.thingspeak.com/channels/3518528/fields/1/last.json"
        );

        const data = await response.json();

        const level = Number(data.field1);

        document.getElementById("waterLevel").textContent = level;

        if (level > 80) {
          document.getElementById("status").textContent = "⚠️ Critical";
        }
        else if (level > 60) {
          document.getElementById("status").textContent = "⚠️ Warning";
        }
        else {
          document.getElementById("status").textContent = "✓ Normal";
        }

        document.getElementById("updated").textContent =
          "Last updated: " + data.created_at;

      }
      catch (error) {

        document.getElementById("status").textContent =
          "Unable to get data";

        console.log(error);

      }
    }

    getWaterLevel();

  </script>

</body>
</html>
